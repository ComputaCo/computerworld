[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "computaco-core"
version = "0.0.1"
description = "ComputaCo core, from ComputaCo. This version holds the name; the real package comes later."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = ["Development Status :: 1 - Planning", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://computaco.ai"
Source = "https://github.com/ComputaCo/computerworld/tree/main/names/computaco-core"

[tool.setuptools.packages.find]
where = ["src"]
